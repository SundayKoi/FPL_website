name: Mint moment cards

on:
  # Chained, not clocked. A cron said 14:30 and hoped the 07:00 ingest
  # had landed; GitHub queues scheduled runs and can delay them by
  # hours, so 'hoped' was the whole guarantee. Now a week's moments
  # are detected because its games arrived, not because it is 14:30.
  workflow_run:
    workflows: ["Ingest match reports"]
    types: [completed]
  workflow_dispatch:
    inputs:
      week:
        description: "Monday of the week to examine (YYYY-MM-DD). Blank = the last completed week."
        type: string
        default: ""
      dry_run:
        description: "Report what would mint and write nothing"
        type: boolean
        default: false

concurrency:
  group: detect-moments
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-latest
    # A workflow_run fires on every completion, success or not, so the
    # conclusion is checked here rather than assumed. The upstream's OWN
    # trigger is checked too: a scheduled ingest and a hand-run one both
    # drive the chain, which is what makes `workflow_dispatch` the way to
    # catch a missed week up end to end.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/detect-moments.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MOMENT_WEEK: ${{ inputs.week }}
          MOMENTS_DRY_RUN: ${{ inputs.dry_run }}
