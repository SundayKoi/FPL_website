name: Weekly card drop

on:
  # Last but one in Tuesday's chain: ingest -> moments -> HERE -> draw.
  # The drop reads what the ingest wrote and posts the week's moments,
  # so it runs when both are done rather than at a time they usually
  # are.
  workflow_run:
    workflows: ["Mint moment cards"]
    types: [completed]
  workflow_dispatch:
    inputs:
      showcase:
        description: "Post the collection showcase even with no movement"
        type: boolean
        default: true
      fantasy_dry_run:
        description: "Fantasy: compute scores/payouts/post but write and pay NOTHING (rehearsal)"
        type: boolean
        default: false
      fantasy_week:
        description: "Fantasy: grade this Monday (YYYY-MM-DD) instead of the last completed week — pair with dry run unless you mean it"
        type: string
        default: ""

concurrency:
  group: card-drop
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    # Only the automated chain continues past here: the upstream must have
    # been triggered by a workflow_run of its own. Running the workflow
    # ahead of this one by hand — a dry run, a re-check — must never
    # cascade into a real drop that posts to Discord and pays fantasy.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run')
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/weekly-card-drop.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_CARDS_WEBHOOK_URL: ${{ secrets.DISCORD_CARDS_WEBHOOK_URL }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          # Scheduled runs get no inputs -> empty -> movement-only posting
          # and a real (non-dry) fantasy grade of the last completed week.
          SHOWCASE: ${{ inputs.showcase }}
          FANTASY_DRY_RUN: ${{ inputs.fantasy_dry_run }}
          FANTASY_WEEK: ${{ inputs.fantasy_week }}
        # supabase-js needs a native WebSocket -> Node 22 (see weekly-brief).
