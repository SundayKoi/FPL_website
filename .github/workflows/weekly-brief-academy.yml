name: Weekly homepage brief (Academy)

on:
  schedule:
    # 14:30 UTC Tuesday, half an hour behind the Premier brief so the two
    # never contend for the same Anthropic key, and still after Monday
    # night's games have been ingested by the nightly stats job.
    - cron: "30 14 * * 2"
  workflow_dispatch:

# Its own group, so a stuck Academy run never blocks the Premier brief.
concurrency:
  group: academy-brief
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are environment secrets, and a
    # job only sees those when it declares the environment. ANTHROPIC_API_KEY is
    # a repository secret, which is visible either way — the same key the
    # Premier brief uses.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+, not 20: supabase-js builds a realtime client on createClient
          # even when nothing subscribes, and that needs a native WebSocket.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/generate-homepage-brief.ts --league academy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
