name: Weekly homepage brief (Academy)

on:
  # Behind the Premier brief, which is behind the ingest. Chaining the
  # two keeps them from contending for the same Anthropic key without
  # needing the half-hour gap to be enough.
  workflow_run:
    workflows: ["Weekly homepage brief (Premier)"]
    types: [completed]
  workflow_dispatch:

# Its own group, so a stuck Academy run never blocks the Premier brief.
concurrency:
  group: academy-brief
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    # Only the automated chain continues past here: the upstream must have
    # been triggered by a workflow_run of its own. Running the workflow
    # ahead of this one by hand — a dry run, a re-check — must never
    # cascade into a real brief that posts to the homepage.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run')
    # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are environment secrets, and a
    # job only sees those when it declares the environment. ANTHROPIC_API_KEY is
    # a repository secret, which is visible either way — the same key the
    # Premier brief uses.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+, not 20: supabase-js builds a realtime client on createClient
          # even when nothing subscribes, and that needs a native WebSocket.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/generate-homepage-brief.ts --league academy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
