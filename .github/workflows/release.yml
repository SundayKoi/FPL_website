name: Release to production

# `main` is what Vercel deploys; `develop` is where every pull request
# lands. Nothing is built on the way in — the Ignored Build Step skips
# non-production branches — so the site deploys once per release rather
# than once per merge. This workflow is the release: it merges develop
# into main with a merge commit, which Vercel then builds.
#
# Runs every Monday at 13:00 UTC (09:00 New York in summer, 08:00 in
# winter) and on demand from the Actions tab. It refuses to release a
# develop whose CI is not green, and does nothing when develop has
# nothing main lacks.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Anything to release?
        id: diff
        run: |
          git fetch origin develop
          behind=$(git rev-list --count main..origin/develop)
          echo "commits=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ]; then
            echo "main already has everything on develop."
          else
            echo "develop is $behind commit(s) ahead of main."
          fi

      - name: Require green CI on develop
        if: steps.diff.outputs.commits != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WAIT_SECONDS: 1200
        run: |
          set -euo pipefail
          sha=$(git rev-parse origin/develop)
          deadline=$((SECONDS + CI_WAIT_SECONDS))

          # The CI workflow's job is named "checks". A release can start
          # immediately after the develop push, before that check run exists
          # or while it is still running, so wait for this exact commit rather
          # than treating a pending conclusion as a failure.
          while true; do
            read -r status conclusion details_url <<<"$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "checks" and .app.slug == "github-actions")] | sort_by(.started_at) | last | if . == null then ["queued", "", ""] else [.status, (.conclusion // ""), (.details_url // "")] end | @tsv')"
            echo "CI on develop (${sha:0:7}): ${status}${conclusion:+ (${conclusion})} ${details_url}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::Refusing to release: CI on develop completed with '${conclusion}', not 'success'."
                exit 1
              fi
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Refusing to release: CI on develop did not complete within ${CI_WAIT_SECONDS}s."
              exit 1
            fi
            sleep 10
          done

      - name: Merge develop into main
        if: steps.diff.outputs.commits != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A merge commit, never a fast-forward: the Ignored Build Step
          # diffs the deployment against HEAD^, and with a merge commit
          # HEAD^ is the previous release, so a batch whose last commit was
          # docs-only still deploys the code before it.
          git merge --no-ff origin/develop -m "Release $(date -u +%Y-%m-%d): ${{ steps.diff.outputs.commits }} commit(s) from develop"
          git push origin main
