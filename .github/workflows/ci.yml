name: CI

# The checks that used to run only on whoever's machine pushed. Type-check,
# lint and the Vitest suite on every pull request and every push to develop
# or main, so Vercel does not have to be the place a type error is
# discovered — and so `typescript.ignoreBuildErrors` can be turned on in
# next.config.ts once this check is required, taking the type-check out of
# the billed build minute. The release workflow reads this job's result on
# develop before it will merge to main.
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check migration history and ordering
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-migrations.mjs "$MIGRATION_BASE" HEAD
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install requests python-dotenv
      - name: Python script tests
        run: npm run test:python
