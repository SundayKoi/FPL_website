name: Weekly card draw

on:
  # Last in Tuesday's chain, so the drawn week's story is complete
  # before the winner posts.
  workflow_run:
    workflows: ["Weekly card drop"]
    types: [completed]
  workflow_dispatch:
    inputs:
      week:
        description: "Monday of the week to draw (YYYY-MM-DD). Blank = last completed week."
        type: string
        default: ""

concurrency:
  group: weekly-draw
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    # Only the automated chain continues past here: the upstream must have
    # been triggered by a workflow_run of its own. Running the workflow
    # ahead of this one by hand — a dry run, a re-check — must never
    # cascade into a real drop that posts to Discord and pays fantasy.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_run')
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/weekly-draw.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_CARDS_WEBHOOK_URL: ${{ secrets.DISCORD_CARDS_WEBHOOK_URL }}
          # Scheduled runs get no inputs -> empty -> the last completed week.
          DRAW_WEEK: ${{ inputs.week }}
