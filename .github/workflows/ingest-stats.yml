name: Ingest match reports

# The downstream workflows listen for this one finishing, and a workflow_run
# payload carries no inputs — but it does carry the run's display title. So
# a hand-run ingest that opts out of the cascade says so in its own name,
# and the two workflows that listen read it back. Hand-run with the box
# ticked (the default) and the whole of Tuesday follows, which is how a
# missed week is caught up in one click.
run-name: >-
  Ingest match reports${{ github.event_name == 'workflow_dispatch' && !inputs.cascade && ' — no cascade' || '' }}

on:
  schedule:
    # Tuesday only: the league plays Monday night, so one pass the next
    # morning is every game there is to read. 07:23 UTC is 02:23 EST /
    # 03:23 EDT — GitHub cron is UTC only.
    #
    # :23 rather than :00 on purpose. GitHub queues scheduled runs and the
    # queue is deepest at the top of the hour, which is where every cron
    # anybody writes by hand lands; their own guidance is to pick another
    # minute. This job used to sit at :00 and drifted hours late.
    #
    # This is the only clock left in Tuesday's chain. Everything downstream
    # — the briefs, the moment detector, the card drop with the Gauntlet
    # settlement, the weekly draw — now runs when this one finishes rather
    # than at a time it is usually done by.
    - cron: "23 7 * * 2"
  workflow_dispatch:
    inputs:
      cascade:
        description: "Also run the rest of Tuesday (moments, briefs, card drop, draw)"
        type: boolean
        default: true
concurrency:
  group: ingest-stats
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    # secrets live in the repo's "Production" environment — a job only sees
    # environment secrets when it declares the environment
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - run: python scripts/riot_stats_ingest.py --from-reports
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
