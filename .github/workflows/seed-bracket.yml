name: Seed bracket

# Manual only: seeding a bracket is a reviewed operational action, not a
# schedule. Runs against a committed file with the service key so staff do not
# need direct SQL access.
on:
  workflow_dispatch:
    inputs:
      bracket:
        description: "Bracket file to seed, relative to the repo root."
        type: string
        default: "scripts/data/brackets/academy-2026-playoffs.json"
      dry_run:
        description: "Print and review the plan before any write. Leave this ticked first."
        type: boolean
        default: true

concurrency:
  # Two seeds of the same bracket at once could both read a missing slot.
  group: seed-bracket
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate or seed bracket
        shell: bash
        run: |
          args=()
          if [[ "$DRY_RUN" == "false" ]]; then args+=(--write); fi
          npx tsx scripts/seed-bracket.ts "$BRACKET" "${args[@]}"
        env:
          # Values arrive via the environment rather than interpolated shell text.
          BRACKET: ${{ inputs.bracket }}
          DRY_RUN: ${{ inputs.dry_run }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
