name: Weekly homepage brief (Premier)

on:
  # Chained to the ingest rather than clocked an hour after it — see
  # the note in ingest-stats.yml on how late GitHub's scheduler runs.
  workflow_run:
    workflows: ["Ingest match reports"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: homepage-brief
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    # A workflow_run fires on every completion, success or not, so the
    # conclusion is checked here rather than assumed. The upstream's OWN
    # trigger is checked too: a scheduled ingest and a hand-run one both
    # drive the chain, which is what makes `workflow_dispatch` the way to
    # catch a missed week up end to end.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are environment secrets, and a
    # job only sees those when it declares the environment. ANTHROPIC_API_KEY is
    # a repository secret, which is visible either way.
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+, not 20: supabase-js builds a realtime client on createClient
          # even when nothing subscribes, and that needs a native WebSocket.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/generate-homepage-brief.ts --league premier
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
