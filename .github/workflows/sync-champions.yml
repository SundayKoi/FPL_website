name: Sync champions

# Manual only. Reports which champions the bundled roster is missing, and
# probes for a source that knows their LANE.
#
# This exists because the sandbox the agent runs in cannot reach
# ddragon.leagueoflegends.com, and neither can every maintainer's machine.
# A runner can, so the lookup happens here and the answer lands in the job
# log where whoever asked can read it.
#
# Nothing is committed by this workflow. It reads, it prints, a human
# decides. In particular it never writes roles: Data Dragon publishes
# champion CLASSES (Mage, Fighter, Assassin), not lane positions, so the
# lane always comes from a source worth a second look before it is trusted.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Diff the bundled roster against Data Dragon
        run: npx tsx scripts/sync-champions.ts --out /tmp/champions.json

      # Data Dragon has no lane field, so this asks elsewhere. Printed raw
      # and truncated rather than parsed into a verdict: these are
      # third-party shapes that change without notice, and a parser written
      # against a guessed schema reports confident nonsense.
      #
      # What the 2026-08-25 run established: CommunityDragon answers, but
      # its `roles` are CLASSES (assassin, mage, fighter) exactly like Data
      # Dragon's `tags` — useful for narrowing a champion down, not for
      # deciding their lane. The Meraki CDN, the one source that did carry
      # lanes, now 404s. So there is currently NO free source for lane
      # position: a person still has to say where a new champion plays.
      # This step exists to give them the champion's classes, id and title
      # to decide from, not to answer for them.
      - name: Probe for champion classes
        run: |
          set -uo pipefail
          missing=$(jq -r '.missing[].id' /tmp/champions.json)
          if [ -z "$missing" ]; then echo "Nothing missing — no lookup needed."; exit 0; fi
          echo "Missing champion ids: $missing"
          echo

          echo "=== communitydragon champion-summary (id, title, classes) ==="
          curl -sS --max-time 30 \
            "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-summary.json" \
            -o /tmp/cd.json -w "http %{http_code}\n" || echo "unreachable"
          for id in $missing; do
            echo "--- $id ---"
            jq -c --arg id "$id" '.[] | select(.alias == $id)' /tmp/cd.json 2>/dev/null | head -c 900 || echo "not found"
            echo
          done

          echo
          echo 'Those roles are champion CLASSES, not lanes. Pick the lanes by hand'
          echo "and add them to CHAMPION_ROLES in src/lib/match-draft/champions.ts."
